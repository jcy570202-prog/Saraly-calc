<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浪花薪資計算工具 - 哲運娛樂</title>
    
    <!-- 網頁分頁與 iOS 桌面圖示 -->
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Android / PWA 專用圖示設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen py-8 px-4 sm:px-6">
    <div class="max-w-7xl mx-auto">
        <!-- 標題區 -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-6 border border-gray-100">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">🌊 浪花薪資與分潤計算系統</h1>
                    <p class="text-sm text-gray-500 mt-1">哲運娛樂專用結算工具（支援時數檢核、領用扣除、合約版本分潤與對帳單預覽）</p>
                </div>
                <button onclick="addRow()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg transition text-sm shadow-sm flex items-center gap-2">
                    <span>+ 新增直播主</span>
                </button>
            </div>
        </div>

        <!-- 試算表格區 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-6">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="salaryTable">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-xs uppercase tracking-wider border-b border-gray-200">
                            <th class="py-3 px-3 font-semibold">直播主名稱</th>
                            <th class="py-3 px-3 font-semibold">浪花點數</th>
                            <th class="py-3 px-3 font-semibold">領用浪花</th>
                            <th class="py-3 px-3 font-semibold">固定服務費</th>
                            <th class="py-3 px-3 font-semibold">時數 / 合約版本</th>
                            <th class="py-3 px-3 font-semibold">服務費實發</th>
                            <th class="py-3 px-3 font-semibold">分潤實發</th>
                            <th class="py-3 px-3 font-semibold">總計金額</th>
                            <th class="py-3 px-3 text-center font-semibold">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 text-sm text-gray-700" id="tableBody">
                        <!-- 動態插入列 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 總計摘要卡片 -->
        <div class="bg-gradient-to-r from-indigo-900 to-slate-800 rounded-xl shadow-md p-6 text-white">
            <h2 class="text-lg font-semibold mb-4 text-indigo-200">📊 總計與報表摘要</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                <div class="bg-white/10 rounded-lg p-4 backdrop-blur-sm">
                    <p class="text-xs text-indigo-200 uppercase tracking-wider">總服務費實發</p>
                    <p class="text-2xl font-bold mt-1" id="totalServiceFee">NT$ 0</p>
                </div>
                <div class="bg-white/10 rounded-lg p-4 backdrop-blur-sm">
                    <p class="text-xs text-indigo-200 uppercase tracking-wider">總分潤實發</p>
                    <p class="text-2xl font-bold mt-1" id="totalSplitFee">NT$ 0</p>
                </div>
                <div class="bg-white/10 rounded-lg p-4 backdrop-blur-sm border border-indigo-400/30">
                    <p class="text-xs text-indigo-200 uppercase tracking-wider">總支出金額 (總計)</p>
                    <p class="text-2xl font-bold text-amber-300 mt-1" id="grandTotal">NT$ 0</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 對帳單預覽 Modal -->
    <div id="previewModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-2xl">
            <h3 class="text-lg font-bold text-gray-800 mb-2">📋 個人結算對帳單預覽</h3>
            <p class="text-xs text-gray-500 mb-4">以下為該直播主本月份的詳細結算明細：</p>
            <div id="previewContent" class="bg-gray-50 border border-gray-200 rounded-lg p-4 text-xs font-mono text-gray-700 whitespace-pre-line max-h-80 overflow-y-auto mb-4">
                <!-- 動態填入預覽內容 -->
            </div>
            <div class="flex justify-end">
                <button onclick="closeModal()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition shadow-sm">關閉</button>
            </div>
        </div>
    </div>

    <script>
        const tiers = [
            { threshold: 6000000, fee: 110000 },
            { threshold: 5000000, fee: 100000 },
            { threshold: 4000000, fee: 84000 },
            { threshold: 3000000, fee: 68000 },
            { threshold: 2000000, fee: 52000 },
            { threshold: 1000000, fee: 32000 },
            { threshold: 750000, fee: 24000 },
            { threshold: 500000, fee: 16000 },
            { threshold: 400000, fee: 12000 },
            { threshold: 200000, fee: 6000 },
            { threshold: 100000, fee: 3200 },
            { threshold: 0, fee: 0 }
        ];

        function getFixedFee(langhua) {
            if (langhua < 100000) return 0;
            for (let t of tiers) {
                if (langhua >= t.threshold) return t.fee;
            }
            return 0;
        }

        window.onload = function() {
            addRow("直播主 A", 1000000, 0, 20, "瞬_21");
            addRow("直播主 B", 500000, 0, 20, "瞬_25");
        };

        function addRow(name = "新直播主", langhua = 100000, redeemed = 0, hours = 20, contract = "瞬_21") {
            const tbody = document.getElementById('tableBody');
            const row = document.createElement('tr');
            row.className = "hover:bg-gray-50/85 transition";
            
            row.innerHTML = `
                <td class="py-3 px-3">
                    <input type="text" value="${name}" class="name-input w-28 border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </td>
                <td class="py-3 px-3">
                    <input type="number" value="${langhua}" oninput="calculate()" class="langhua-input w-28 border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" min="0" step="1000">
                </td>
                <td class="py-3 px-3">
                    <input type="number" value="${redeemed}" oninput="calculate()" class="redeemed-input w-24 border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" min="0" step="1000">
                </td>
                <td class="py-3 px-3">
                    <span class="fixed-fee font-medium text-gray-800">0</span>
                </td>
                <td class="py-3 px-3">
                    <div class="flex items-center gap-1">
                        <input type="number" value="${hours}" oninput="calculate()" placeholder="時數" class="hours-input w-14 border border-gray-300 rounded px-1 py-1 text-xs" title="時數">
                        <span class="text-gray-400">/</span>
                        <select onchange="calculate()" class="contract-select border border-gray-300 rounded px-1.5 py-1 text-xs bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500" title="合約版本">
                            <option value="瞬_21" ${contract === '瞬_21' ? 'selected' : ''}>瞬_21</option>
                            <option value="瞬_25" ${contract === '瞬_25' ? 'selected' : ''}>瞬_25</option>
                        </select>
                    </div>
                </td>
                <td class="py-3 px-3 text-gray-600 service-fee-actual">0</td>
                <td class="py-3 px-3 text-gray-600 split-fee-actual">0</td>
                <td class="py-3 px-3 font-semibold text-indigo-600 row-total">0</td>
                <td class="py-3 px-3 text-center flex items-center justify-center gap-1.5">
                    <button onclick="openPreviewModal(this)" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 text-xs font-medium px-2.5 py-1.5 rounded transition" title="預覽對帳單">預覽</button>
                    <button onclick="removeRow(this)" class="text-red-400 hover:text-red-600 text-xs font-medium px-2 py-1.5 rounded transition">刪除</button>
                </td>
            `;
            tbody.appendChild(row);
            calculate();
        }

        function removeRow(btn) {
            btn.closest('tr').remove();
            calculate();
        }

        function formatCurrency(num) {
            return "NT$ " + Math.round(num).toLocaleString();
        }

        function calculate() {
            const rows = document.querySelectorAll('#tableBody tr');
            let totalService = 0;
            let totalSplit = 0;

            rows.forEach(row => {
                const langhua = parseFloat(row.querySelector('.langhua-input').value) || 0;
                const redeemed = parseFloat(row.querySelector('.redeemed-input').value) || 0;
                const hours = parseFloat(row.querySelector('.hours-input').value) || 0;
                const contract = row.querySelector('.contract-select').value;
                
                // 瞬_21 係數 20，瞬_25 係數 24
                const divisor = (contract === '瞬_25') ? 24 : 20;

                const fixedFee = getFixedFee(langhua);
                row.querySelector('.fixed-fee').innerText = fixedFee.toLocaleString();

                let serviceFeeActual = 0;
                if (hours < 20 || langhua < 100000) {
                    serviceFeeActual = 0;
                } else {
                    const effectiveHours = Math.min(hours, 20);
                    if (fixedFee === 3200) {
                        serviceFeeActual = (fixedFee - 1200) * 0.95;
                    } else {
                        serviceFeeActual = (fixedFee - (effectiveHours * 100)) * 0.95;
                    }
                }

                const netLanghua = Math.max(0, langhua - redeemed);
                let splitFeeActual = 0;
                if (divisor > 0) {
                    const step1 = Math.floor(netLanghua / divisor);
                    splitFeeActual = Math.ceil(step1 * 0.9 * 0.95);
                }

                const rowTotal = serviceFeeActual + splitFeeActual;

                row.querySelector('.service-fee-actual').innerText = Math.round(serviceFeeActual).toLocaleString();
                row.querySelector('.split-fee-actual').innerText = splitFeeActual.toLocaleString();
                row.querySelector('.row-total').innerText = formatCurrency(rowTotal);

                totalService += serviceFeeActual;
                totalSplit += splitFeeActual;
            });

            document.getElementById('totalServiceFee').innerText = formatCurrency(totalService);
            document.getElementById('totalSplitFee').innerText = formatCurrency(totalSplit);
            document.getElementById('grandTotal').innerText = formatCurrency(totalService + totalSplit);
        }

        function openPreviewModal(btn) {
            const row = btn.closest('tr');
            const name = row.querySelector('.name-input').value || "直播主";
            const langhua = parseFloat(row.querySelector('.langhua-input').value) || 0;
            const redeemed = parseFloat(row.querySelector('.redeemed-input').value) || 0;
            const fixedFee = row.querySelector('.fixed-fee').innerText;
            const hours = row.querySelector('.hours-input').value || 0;
            const contract = row.querySelector('.contract-select').value;
            const serviceFeeActual = row.querySelector('.service-fee-actual').innerText;
            const splitFeeActual = row.querySelector('.split-fee-actual').innerText;
            const rowTotal = row.querySelector('.row-total').innerText;

            const previewText = `【哲運娛樂】${name} - 薪資與分潤結算明細
----------------------------------------
• 本月浪花點數：${langhua.toLocaleString()} 點 (級距固定服務費: NT$ ${fixedFee})
• 領用浪花扣除：${redeemed.toLocaleString()} 點
• 直播時數 / 合約版本：${hours} 小時 / ${contract}
----------------------------------------
• 服務費實發：NT$ ${serviceFeeActual}
• 分潤實發：NT$ ${splitFeeActual}
----------------------------------------
本月總計實領金額：${rowTotal}
----------------------------------------
（哲運娛樂經紀有限公司 敬上）`;

            document.getElementById('previewContent').innerText = previewText;
            document.getElementById('previewModal').classList.remove('hidden');
            document.getElementById('previewModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('previewModal').classList.remove('flex');
            document.getElementById('previewModal').classList.add('hidden');
        }
    </script>
</body>
</html>
