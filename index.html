<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直播主對帳查詢系統</title>
    <!-- 引入 Tailwind CSS 快速排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- 登入卡片 -->
        <div id="loginCard" class="bg-white rounded-xl shadow-md p-6 space-y-4">
            <h1 class="text-2xl font-bold text-center text-gray-800">直播主對帳查詢</h1>
            <div>
                <label class="block text-sm font-medium text-gray-700">登入 ID</label>
                <input type="text" id="inputId" class="mt-1 w-full px-3 py-2 border rounded-lg focus:ring focus:ring-blue-300" placeholder="請輸入 ID (例如: S001)">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">密碼</label>
                <input type="password" id="inputPassword" class="mt-1 w-full px-3 py-2 border rounded-lg focus:ring focus:ring-blue-300" placeholder="請輸入密碼">
            </div>
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">登入查詢</button>
        </div>

        <!-- 查詢結果卡片 (預設隱藏) -->
        <div id="queryCard" class="bg-white rounded-xl shadow-md p-6 space-y-4 hidden">
            <div class="flex justify-between items-center border-b pb-3">
                <div>
                    <h2 id="welcomeName" class="text-xl font-bold text-gray-800"></h2>
                    <p class="text-xs text-gray-500">ID: <span id="welcomeId"></span> | 簽約項目: <span id="welcomeContract"></span></p>
                </div>
                <button onclick="handleLogout()" class="text-sm text-red-500 hover:underline">登出</button>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">選擇結算月份</label>
                <select id="selectMonth" onchange="loadStatement()" class="mt-1 w-full px-3 py-2 border rounded-lg bg-white">
                    <!-- 動態載入月份 -->
                </select>
            </div>

            <div id="statementResult" class="bg-gray-50 p-4 rounded-lg space-y-2 text-sm text-gray-700">
                <!-- 動態載入對帳細節 -->
            </div>
        </div>
    </div>

    <script>
        // 內建預設資料（作為 fallback，避免本地直接開檔抓不到 JSON 導致無法登入）
        let streamersData = [
            { id: "S001", name: "直播主A", contract: "合約A", password: "123" },
            { id: "S002", name: "直播主B", contract: "合約B", password: "456" }
        ];

        let incomeData = [
            { id: "S001", month: "2026-03", langhua: 1200000, redeemed: 200000, hours: 25 },
            { id: "S002", month: "2026-03", langhua: 600000, redeemed: 0, hours: 18 }
        ];

        let currentStreamer = null;

        // 非同步嘗試讀取外部 JSON 檔案（若正式上線有掛 Web Server 可讀取外部檔案）
        async function fetchStatementData() {
            try {
                const resS = await fetch('streamers.json');
                const dataS = await resS.json();
                if (dataS && dataS.length > 0) streamersData = dataS;

                const resI = await fetch('income.json');
                const dataI = await resI.json();
                if (dataI && dataI.length > 0) incomeData = dataI;
                
                console.log("外部 JSON 對帳資料載入成功");
            } catch (e) {
                console.log("目前為本地預設模式或讀取失敗，使用內建測試資料。");
            }
        }
        fetchStatementData();

        function handleLogin() {
            const idInput = document.getElementById('inputId').value.trim();
            const passInput = document.getElementById('inputPassword').value.trim();

            const streamer = streamersData.find(s => s.id === idInput && s.password === passInput);
            if (!streamer) {
                alert(`ID (${idInput}) 或密碼錯誤，請重新檢查！`);
                return;
            }

            currentStreamer = streamer;
            document.getElementById('welcomeName').innerText = streamer.name;
            document.getElementById('welcomeId').innerText = streamer.id;
            document.getElementById('welcomeContract').innerText = streamer.contract;

            // 篩選該直播主的月份資料
            const months = incomeData.filter(item => item.id === streamer.id).map(item => item.month);
            const selectMonth = document.getElementById('selectMonth');
            selectMonth.innerHTML = '';
            
            if (months.length === 0) {
                selectMonth.innerHTML = '<option value="">目前無結算資料</option>';
                document.getElementById('statementResult').innerHTML = '<p class="text-gray-500 text-center">尚無對帳紀錄</p>';
            } else {
                months.forEach(m => {
                    const [y, mm] = m.split('-');
                    const opt = document.createElement('option');
                    opt.value = m;
                    opt.innerText = `${y} 年 ${parseInt(mm)} 月`;
                    selectMonth.appendChild(opt);
                });
                loadStatement();
            }

            // 切換畫面卡片
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('queryCard').classList.remove('hidden');
        }

        function loadStatement() {
            const selectedMonth = document.getElementById('selectMonth').value;
            const record = incomeData.find(item => item.id === currentStreamer.id && item.month === selectedMonth);
            const resultDiv = document.getElementById('statementResult');

            if (!record) {
                resultDiv.innerHTML = '<p class="text-gray-500">查無此月份資料</p>';
                return;
            }

            resultDiv.innerHTML = `
                <div class="flex justify-between"><span>結算月份：</span><span class="font-semibold">${record.month}</span></div>
                <div class="flex justify-between"><span>總浪花點數：</span><span class="font-semibold text-blue-600">${record.langhua.toLocaleString()}</span></div>
                <div class="flex justify-between"><span>已兌換金額：</span><span class="font-semibold text-green-600">${record.redeemed.toLocaleString()}</span></div>
                <div class="flex justify-between"><span>直播時數：</span><span class="font-semibold">${record.hours} 小時</span></div>
            `;
        }

        function handleLogout() {
            currentStreamer = null;
            document.getElementById('inputId').value = '';
            document.getElementById('inputPassword').value = '';
            document.getElementById('queryCard').classList.add('hidden');
            document.getElementById('loginCard').classList.remove('hidden');
        }
    </script>
</body>
</html>
